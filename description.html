<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Description viewer</title>
  <style>
    html { background: #02091d; color: cyan; overflow-y: scroll; scrollbar-gutter: stable; scrollbar-width: auto; scrollbar-color: #72849b #02091d; }
    ::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar { width: 32px; height: 12px; }
    ::-webkit-scrollbar:vertical, html::-webkit-scrollbar:vertical, body::-webkit-scrollbar:vertical { width: 32px; }
    ::-webkit-scrollbar:horizontal, html::-webkit-scrollbar:horizontal, body::-webkit-scrollbar:horizontal { height: 12px; }
    ::-webkit-scrollbar-track, html::-webkit-scrollbar-track, body::-webkit-scrollbar-track { background: #02091d; }
    ::-webkit-scrollbar-thumb, html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb { background: #72849b; border: 1px solid #02091d; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover, html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover { background: #b3b8be; }
    @media (pointer: coarse) {
      ::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar { width: 36px; height: 12px; }
      ::-webkit-scrollbar:vertical, html::-webkit-scrollbar:vertical, body::-webkit-scrollbar:vertical { width: 36px; }
    }
    body { margin: 0; padding: 0; background: #02091d; color: cyan; font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; font-weight: 500; line-height: 1.42; }
    .fractal-background { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
    .page-shell { position: relative; z-index: 1; width: 100%; min-height: 100vh; background: rgba(2, 9, 29, 0.32); }
    .toolbar-row { position: sticky; top: 0; z-index: 20; min-width: 0; background: rgba(2, 9, 29, 0.96); border-bottom: 1px solid rgba(232, 232, 232, 0.18); }
    .toolbar-cell { min-width: 0; }
    .document-row, .document-cell { min-width: 0; }
    .find-bar { display: flex; gap: 4px; width: 100%; padding: 2px 4px; box-sizing: border-box; background: transparent; }
    .find-bar input, .find-bar button { font: inherit; color: cyan; background: #101316; border: 1px solid rgba(0, 255, 255, 0.36); border-radius: 4px; }
    .find-bar input { flex: 1 1 auto; min-width: 0; padding: 5px 7px; }
    .find-bar button { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; min-width: 42px; height: 34px; box-sizing: border-box; padding: 5px 8px; cursor: pointer; }
    .find-bar [data-prev-page], .find-bar [data-next-page] { font-size: 1.6em; line-height: 1; padding-top: 0; padding-bottom: 0; }
    .find-bar input:focus, .find-bar button:focus { outline: 2px solid cyan; outline-offset: 2px; }
    .find-bar button:hover { background: #171c20; }
    .document-scroll { padding: 8px; box-sizing: border-box; }
    main { max-width: 1180px; margin: 0 auto; }
    main::after { content: ""; display: block; height: calc(100vh - 3rem); }
    .site-footer { position: relative; z-index: 1; display: flex; justify-content: flex-end; width: fit-content; max-width: min(760px, calc(100% - 16px)); margin: 0 auto 10px; padding: 6px 10px; box-sizing: border-box; color: cyan; font-size: 0.875em; line-height: 1.55; }
    .site-footer .viewer-version { flex: 0 0 auto; padding-right: 0.25ch; white-space: nowrap; }
    .image-block { width: calc(100vw - 16px); margin: 8px 0 10px 50%; transform: translateX(-50%); }
    .image-block img { display: block; width: 100%; max-width: 100%; height: auto; margin: 0 auto; border: 0; }
    .image-block.fit-height img { width: auto; max-width: 100%; object-fit: contain; }
    @media (max-width: 700px) {
      body { font-size: 14px; }
      .document-scroll { padding: 6px; }
      .find-bar { gap: 2px; padding: 2px; }
      .find-bar button { min-width: 36px; height: 32px; padding: 5px 4px; }
      .find-bar [data-prev-page], .find-bar [data-next-page] { padding-top: 0; padding-bottom: 0; }
    }
    @media print {
      body { background: #fff; color: #000; }
      .fractal-background { display: none; }
      .page-shell { background: transparent; }
      .document-scroll { padding: 0; }
      .toolbar-row { display: none !important; }
      main::after { display: none; }
      .doc-page { break-after: page; page-break-after: always; border-top: 0 !important; margin-bottom: 0; }
      .doc-page:last-child { break-after: auto; page-break-after: auto; }
      .page-label { color: #777 !important; }
      .image-block { width: 100%; margin-left: 0; transform: none; }
    }
    @media (max-width: 700px) {
      .image-block { width: calc(100vw - 12px); margin-top: 8px; margin-bottom: 10px; }
    }
  </style>
</head>
<body data-text-url="Description.txt" data-hide-page-dividers>
  <canvas class="fractal-background" data-fractal-background aria-hidden="true"></canvas>
  <div class="page-shell">
    <div class="toolbar-row">
      <form class="find-bar" data-find-form>
        <button type="button" data-prev-page title="previous page">⎗</button>
        <button type="button" data-half-page-up title="three quarter screen up">↑▭</button>
        <button type="button" data-find-up title="find up">↑🔍</button>
        <input data-find-input type="search" autocomplete="off" spellcheck="false" aria-label="find">
        <button type="submit" data-find-down title="find down">🔎↓</button>
        <button type="button" data-half-page-down title="three quarter screen down">▭↓</button>
        <button type="button" data-next-page title="next page">⎘</button>
      </form>
    </div>
    <div class="document-scroll">
      <footer class="site-footer" aria-label="Версия просмотрщика">
        <span class="viewer-version" data-viewer-version>v23</span>
      </footer>
      <main data-pages-root>
        <section class="doc-page" id="page-1" data-page="1">
          <div class="page-label">...</div>
          <pre class="text-block loading">Загрузка Description.txt...</pre>
        </section>
      </main>
      <div class="document-modified" data-document-modified aria-label="Дата и время изменения текста"></div>
    </div>
  </div>
  <script src="text-viewer.js?v=23"></script>
</body>
</html>
