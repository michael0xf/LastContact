<script>
  (() => {
    const canvas = document.querySelector("[data-fractal-background]");
    const context = canvas.getContext("2d", { alpha: false });
    const MAX_PIXELS = 560000;
    const MAX_ITERATIONS = 96;
    let resizeTimer = 0;

    const drawMandelbrot = () => {
      const cssWidth = Math.max(1, window.innerWidth);
      const cssHeight = Math.max(1, window.innerHeight);
      const pixelScale = Math.min(
        window.devicePixelRatio || 1,
        Math.sqrt(MAX_PIXELS / (cssWidth * cssHeight))
      );
      const width = Math.max(1, Math.round(cssWidth * pixelScale));
      const height = Math.max(1, Math.round(cssHeight * pixelScale));

      canvas.width = width;
      canvas.height = height;

      const image = context.createImageData(width, height);
      const pixels = image.data;
      const centerX = -0.62;
      const centerY = 0;
      const spanX = 3.15;
      const spanY = spanX * height / width;

      for (let y = 0; y < height; y += 1) {
        const cImaginary = centerY + (y / height - 0.5) * spanY;

        for (let x = 0; x < width; x += 1) {
          const cReal = centerX + (x / width - 0.5) * spanX;
          let zReal = 0;
          let zImaginary = 0;
          let iteration = 0;

          // Z(n + 1) = Z(n)^2 + C
          while (
            zReal * zReal + zImaginary * zImaginary <= 4 &&
            iteration < MAX_ITERATIONS
          ) {
            const nextReal = zReal * zReal - zImaginary * zImaginary + cReal;
            zImaginary = 2 * zReal * zImaginary + cImaginary;
            zReal = nextReal;
            iteration += 1;
          }

          const offset = (y * width + x) * 4;
          if (iteration === MAX_ITERATIONS) {
            pixels[offset] = 5;
            pixels[offset + 1] = 15;
            pixels[offset + 2] = 38;
          } else {
            const intensity = Math.pow(iteration / MAX_ITERATIONS, 0.46);
            pixels[offset] = 2 + Math.round(18 * intensity);
            pixels[offset + 1] = 12 + Math.round(74 * intensity);
            pixels[offset + 2] = 42 + Math.round(170 * intensity);
          }
          pixels[offset + 3] = 255;
        }
      }

      context.putImageData(image, 0, 0);
    };

    const scheduleDraw = () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        window.requestAnimationFrame(drawMandelbrot);
      }, 160);
    };

    window.requestAnimationFrame(drawMandelbrot);
    window.addEventListener("resize", scheduleDraw);
  })();
</script>
<script>
  (() => {
    const TEXT_URL = "Luminamyxa.txt";
    const LINES_PER_PAGE = 34;

    const form = document.querySelector("[data-find-form]");
    const input = document.querySelector("[data-find-input]");
    const prevPageButton = document.querySelector("[data-prev-page]");
    const halfPageUpButton = document.querySelector("[data-half-page-up]");
    const findUpButton = document.querySelector("[data-find-up]");
    const halfPageDownButton = document.querySelector("[data-half-page-down]");
    const nextPageButton = document.querySelector("[data-next-page]");
    const root = document.querySelector("[data-pages-root]");
    let pages = [];
    let lastQuery = "";
    let lastMatch = null;
    let scrollHashTimer = 0;
    let imageFitFrame = 0;

    const normalize = (value) => value.toLocaleLowerCase();
    const toolbarOffset = () => Math.ceil(document.querySelector(".toolbar-row").getBoundingClientRect().height) + 4;
    const viewportHeight = () => Math.floor(window.visualViewport?.height || document.documentElement.clientHeight || window.innerHeight);
    const pageLabelText = (pageNumber) => `page ${pageNumber}`;
    const imageLinePattern = /^\s*<img\s+([^>]*?)\/?>\s*$/iu;
    const attributePattern = /([^\s=\/<>]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+))/gu;

    const appendText = (element, text) => {
      element.append(document.createTextNode(text));
    };

    const parseImageLine = (line) => {
      const match = imageLinePattern.exec(line);
      if (!match) return null;

      const attributes = {};
      match[1].replace(attributePattern, (_, name, doubleQuoted, singleQuoted, bare) => {
        attributes[name.toLocaleLowerCase()] = doubleQuoted ?? singleQuoted ?? bare ?? "";
        return "";
      });

      const src = (attributes.src || "").trim();
      if (!src) return null;
      return {
        src,
        alt: attributes.alt || ""
      };
    };

    const lineNumberedBlock = (block, firstLineNumber) => {
      if (block.classList.contains("line-numbered")) return firstLineNumber;
      const rawText = block.textContent;
      const lines = rawText.split("\n");
      let nextLineNumber = firstLineNumber;
      block.textContent = "";
      block.classList.add("line-numbered");

      lines.forEach((line) => {
        const row = document.createElement("span");
        row.className = "line-row";

        const number = document.createElement("span");
        number.className = "line-number";
        number.setAttribute("aria-hidden", "true");

        const value = document.createElement("span");
        value.className = "line-number-value";
        if (line.trim()) {
          value.textContent = String(nextLineNumber);
          nextLineNumber += 1;
        }
        number.append(value);

        const content = document.createElement("span");
        content.className = "line-content";
        appendText(content, line);

        row.append(number, content);
        block.append(row);
      });

      return nextLineNumber;
    };

    const applyPageLabels = () => {
      root.querySelectorAll(".doc-page").forEach((page) => {
        const label = page.querySelector(".page-label");
        if (label && page.dataset.page) label.textContent = pageLabelText(page.dataset.page);
      });
    };

    const applyLineNumbers = () => {
      let lineNumber = 1;
      root.querySelectorAll(".text-block").forEach((block) => {
        if (block.classList.contains("loading") || block.classList.contains("error")) return;
        lineNumber = lineNumberedBlock(block, lineNumber);
      });
    };

    const availableImageHeight = () => {
      return Math.max(180, viewportHeight() - toolbarOffset() - 24);
    };

    const fitImageBlock = (block) => {
      const image = block.querySelector("img");
      if (!image || !image.naturalWidth || !image.naturalHeight) return;

      const availableWidth = block.getBoundingClientRect().width;
      const heightByWidth = availableWidth * image.naturalHeight / image.naturalWidth;
      const maxHeight = availableImageHeight();

      if (heightByWidth > maxHeight) {
        block.classList.add("fit-height");
        image.style.width = "auto";
        image.style.height = `${maxHeight}px`;
      } else {
        block.classList.remove("fit-height");
        image.style.width = "";
        image.style.height = "";
      }
    };

    const fitAllImages = () => {
      root.querySelectorAll(".image-block").forEach(fitImageBlock);
    };

    const scheduleImageFits = () => {
      window.cancelAnimationFrame(imageFitFrame);
      imageFitFrame = window.requestAnimationFrame(fitAllImages);
    };

    const scrollToTop = (top, behavior = "smooth") => {
      try {
        window.scrollTo({ top, behavior });
      } catch (_) {
        window.scrollTo(0, top);
      }
    };

    const pageTop = (page) => {
      const pageRect = page.getBoundingClientRect();
      return Math.max(0, window.scrollY + pageRect.top - toolbarOffset());
    };

    const replacePageHash = (page) => {
      if (!page?.dataset.page) return;
      const hash = `#page-${page.dataset.page}`;
      if (location.hash !== hash) {
        history.replaceState({}, "", hash);
      }
    };

    const pageForNode = (node) => {
      const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      return element?.closest(".doc-page") || null;
    };

    const pageIndexFromHash = () => {
      const match = /^#page-(\d+)$/.exec(location.hash);
      if (!match) return -1;
      return pages.findIndex((page) => page.dataset.page === match[1]);
    };

    const textNodes = () => {
      const nodes = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue) nodes.push(node);
      }
      return nodes;
    };

    const makeRange = (node, start, length) => {
      const range = document.createRange();
      range.setStart(node, start);
      range.setEnd(node, start + length);
      return range;
    };

    const selectRange = (range) => {
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      const rect = range.getBoundingClientRect();
      const top = Math.max(0, window.scrollY + rect.top - viewportHeight() * 0.28);
      scrollToTop(top);
    };

    const selectMatch = (query, node, start) => {
      const range = makeRange(node, start, query.length);
      lastMatch = {
        query: normalize(query),
        node,
        start,
        end: start + query.length
      };
      replacePageHash(pageForNode(node));
      selectRange(range);
      return true;
    };

    const findFirst = (query) => {
      const needle = normalize(query);
      for (const node of textNodes()) {
        const haystack = node.nodeValue.toLocaleLowerCase();
        const start = haystack.indexOf(needle);
        if (start !== -1) return { node, start };
      }
      return false;
    };

    const findLast = (query) => {
      const needle = normalize(query);
      let last = null;
      for (const node of textNodes()) {
        const haystack = node.nodeValue.toLocaleLowerCase();
        let start = 0;
        while ((start = haystack.indexOf(needle, start)) !== -1) {
          last = { node, start };
          start += Math.max(query.length, 1);
        }
      }
      return last;
    };

    const rangeTop = (node, start, length) => {
      return makeRange(node, start, length).getBoundingClientRect().top;
    };

    const findFromViewport = (query, direction) => {
      const needle = normalize(query);
      const viewportTop = toolbarOffset() + 2;
      let first = null;
      let previous = null;
      let last = null;

      for (const node of textNodes()) {
        const haystack = node.nodeValue.toLocaleLowerCase();
        let start = 0;
        while ((start = haystack.indexOf(needle, start)) !== -1) {
          const match = { node, start };
          const top = rangeTop(node, start, query.length);
          if (!first) first = match;
          last = match;

          if (direction === "down" && top >= viewportTop) {
            return match;
          }
          if (direction === "up") {
            if (top < viewportTop) {
              previous = match;
            } else if (previous) {
              return previous;
            }
          }

          start += Math.max(query.length, 1);
        }
      }
      return direction === "down" ? first : (previous || last);
    };

    const findAfterLast = (query) => {
      const needle = normalize(query);
      let afterLast = false;

      for (const node of textNodes()) {
        let start = 0;
        if (!afterLast) {
          if (!lastMatch || node !== lastMatch.node) continue;
          afterLast = true;
          start = lastMatch.end;
        }
        const haystack = node.nodeValue.toLocaleLowerCase();
        while ((start = haystack.indexOf(needle, start)) !== -1) {
          return { node, start };
        }
      }
      return afterLast ? findFirst(query) : findFromViewport(query, "down");
    };

    const findBeforeLast = (query) => {
      const needle = normalize(query);
      let previous = null;

      for (const node of textNodes()) {
        const haystack = node.nodeValue.toLocaleLowerCase();
        let start = 0;
        while ((start = haystack.indexOf(needle, start)) !== -1) {
          if (lastMatch && node === lastMatch.node && start >= lastMatch.start) {
            return previous || findLast(query);
          }
          previous = { node, start };
          start += Math.max(query.length, 1);
        }
      }
      return lastMatch ? previous : findFromViewport(query, "up");
    };

    const runFind = (direction) => {
      const query = input.value.trim();
      if (!query) return;
      const normalizedQuery = normalize(query);
      const sameQuery = normalizedQuery === lastQuery && lastMatch && lastMatch.query === normalizedQuery;
      const match = sameQuery
        ? (direction === "down" ? findAfterLast(query) : findBeforeLast(query))
        : findFromViewport(query, direction);

      input.blur();
      lastQuery = normalizedQuery;
      if (match) {
        selectMatch(query, match.node, match.start);
      } else {
        lastMatch = null;
      }
    };

    const resetSearch = () => {
      lastQuery = "";
      lastMatch = null;
    };

    const currentPageIndex = () => {
      if (!pages.length) return 0;
      const marker = window.scrollY + toolbarOffset() + 6;
      let currentIndex = 0;

      for (let index = 0; index < pages.length; index++) {
        const rect = pages[index].getBoundingClientRect();
        const top = window.scrollY + rect.top;
        if (top <= marker) {
          currentIndex = index;
        } else {
          break;
        }
      }
      return currentIndex;
    };

    const navigationPageIndex = () => {
      const hashIndex = pageIndexFromHash();
      return hashIndex >= 0 ? hashIndex : currentPageIndex();
    };

    const syncHashToCurrentPage = () => {
      if (pages.length) replacePageHash(pages[currentPageIndex()]);
    };

    const scrollToPageIndex = (index, behavior = "smooth", shouldResetSearch = true) => {
      if (!pages.length) return;
      const safeIndex = Math.min(Math.max(index, 0), pages.length - 1);
      const page = pages[safeIndex];
      scrollToTop(pageTop(page), behavior);
      replacePageHash(page);
      if (shouldResetSearch) resetSearch();
    };

    const goToPage = (delta) => {
      scrollToPageIndex(navigationPageIndex() + delta);
    };

    const maxScrollTop = () => {
      const documentHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      return Math.max(0, documentHeight - viewportHeight());
    };

    const screenStep = () => {
      return Math.max(1, viewportHeight() - toolbarOffset()) * 0.75;
    };

    const scrollByScreenStep = (direction) => {
      const nextTop = window.scrollY + direction * screenStep();
      const clampedTop = Math.min(Math.max(nextTop, 0), maxScrollTop());
      scrollToTop(clampedTop);
      resetSearch();
    };

    const createPage = (pageNumber) => {
      const section = document.createElement("section");
      section.className = "doc-page";
      section.id = `page-${pageNumber}`;
      section.dataset.page = String(pageNumber);

      const label = document.createElement("div");
      label.className = "page-label";
      label.textContent = pageLabelText(pageNumber);
      section.append(label);

      return section;
    };

    const appendTextPage = (pageNumber, lines) => {
      const section = createPage(pageNumber);
      const pre = document.createElement("pre");
      pre.className = "text-block";
      pre.textContent = lines.join("\n").replace(/\s+$/u, "");
      section.append(pre);
      root.append(section);
    };

    const appendImagePage = (pageNumber, image) => {
      const section = createPage(pageNumber);
      const block = document.createElement("div");
      block.className = "image-block";

      const element = document.createElement("img");
      element.src = image.src;
      element.alt = image.alt;
      element.loading = "lazy";
      element.decoding = "async";
      element.addEventListener("load", scheduleImageFits);

      block.append(element);
      section.append(block);
      root.append(section);
      if (element.complete) scheduleImageFits();
    };

    const renderPages = (rawText) => {
      const normalized = rawText.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const lines = normalized.split("\n");
      root.textContent = "";

      let pageNumber = 1;
      let textLines = [];

      const flushTextPage = () => {
        if (!textLines.length) return;
        appendTextPage(pageNumber, textLines);
        pageNumber += 1;
        textLines = [];
      };

      for (const line of lines) {
        const image = parseImageLine(line);
        if (image) {
          flushTextPage();
          appendImagePage(pageNumber, image);
          pageNumber += 1;
          continue;
        }

        textLines.push(line);
        if (textLines.length >= LINES_PER_PAGE) flushTextPage();
      }
      flushTextPage();

      pages = Array.from(document.querySelectorAll(".doc-page"));
      applyPageLabels();
      applyLineNumbers();
      scheduleImageFits();
      resetSearch();
    };

    const renderError = (error) => {
      root.innerHTML = "";
      const section = document.createElement("section");
      section.className = "doc-page";
      section.id = "page-1";
      section.dataset.page = "1";
      const label = document.createElement("div");
      label.className = "page-label";
      label.textContent = "!";
      const pre = document.createElement("pre");
      pre.className = "text-block error";
      pre.textContent = "Если страница открыта как локальный файл, браузер может запрещать чтение соседнего txt.";
      const fallback = document.createElement("div");
      fallback.className = "file-load";
      fallback.textContent = "Загрузить текст вручную:";
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = ".txt,text/plain";
      fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        const text = await file.text();
        renderPages(text);
        scrollToPageIndex(0, "auto", false);
      });
      fallback.append(fileInput);
      section.append(label, pre, fallback);
      root.append(section);
      pages = [section];
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      runFind("down");
    });

    input.addEventListener("input", resetSearch);
    findUpButton.addEventListener("click", () => runFind("up"));
    prevPageButton.addEventListener("click", () => goToPage(-1));
    halfPageUpButton.addEventListener("click", () => scrollByScreenStep(-1));
    halfPageDownButton.addEventListener("click", () => scrollByScreenStep(1));
    nextPageButton.addEventListener("click", () => goToPage(1));

    window.addEventListener("scroll", () => {
      window.clearTimeout(scrollHashTimer);
      scrollHashTimer = window.setTimeout(syncHashToCurrentPage, 120);
    });

    window.addEventListener("resize", () => {
      scheduleImageFits();
    });
    if (document.fonts?.ready) {
      document.fonts.ready.then(scheduleImageFits).catch(() => {});
    }

    window.addEventListener("hashchange", () => {
      const index = pageIndexFromHash();
      if (index >= 0) {
        scrollToPageIndex(index, "auto", false);
      }
    });

    const openHashPage = () => {
      const index = pageIndexFromHash();
      if (index >= 0) {
        scrollToPageIndex(index, "auto", false);
      }
    };

    fetch(TEXT_URL, { cache: "no-cache" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);
        return response.text();
      })
      .then((text) => {
        renderPages(text);
        openHashPage();
        window.addEventListener("load", openHashPage, { once: true });
      })
      .catch(renderError);
  })();
</script>
</body>
</html>
